name: Build All (APK + EXE + Linux DEB)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'http://localhost:8080' }}

jobs:
  # ------------------------------------------------------------------ ANDROID APK
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project folder dhoondo
        shell: bash
        run: |
          P=$(find . -type f -path '*/shared_app/pubspec.yaml' -not -path './.git/*' | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$P" ]; then echo "shared_app/pubspec.yaml repo mein nahi mili. Repo ki files:"; find . -maxdepth 3 -not -path './.git/*' | head -50; exit 1; fi
          ROOT=$(dirname "$(dirname "$P")")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter create (missing gradle files banata hai)
        working-directory: ${{ env.ROOT }}/shared_app
        run: flutter create --platforms=android --org com.deviceagent --project-name shared_app .
      - name: Duplicate .kts hatao
        working-directory: ${{ env.ROOT }}/shared_app
        run: |
          for f in settings.gradle build.gradle app/build.gradle; do rm -f "android/$f.kts"; done
          rm -rf android/app/src/main/kotlin/com/example
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter pub get
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter build apk --release --dart-define=CONTROL_API_URL=${{ env.CONTROL_API_URL }}
      - working-directory: ${{ env.ROOT }}/shared_app
        run: cp build/app/outputs/flutter-apk/app-release.apk ../UniversalDeviceAgent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.ROOT }}/UniversalDeviceAgent.apk

  # ------------------------------------------------------------------ WINDOWS EXE
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project folder dhoondo
        shell: bash
        run: |
          P=$(find . -type f -path '*/shared_app/pubspec.yaml' -not -path './.git/*' | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$P" ]; then echo "shared_app/pubspec.yaml repo mein nahi mili."; exit 1; fi
          ROOT=$(dirname "$(dirname "$P")")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter create --platforms=windows --org com.deviceagent --project-name shared_app .
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter pub get
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter build windows --release --dart-define=CONTROL_API_URL=${{ env.CONTROL_API_URL }}
      - name: Installer (.exe) banao - Inno Setup
        working-directory: ${{ env.ROOT }}
        shell: pwsh
        run: |
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile installers\windows\vc_redist.x64.exe
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installers\windows\universal_device_agent.iss
      - name: Portable ZIP
        working-directory: ${{ env.ROOT }}
        shell: pwsh
        run: Compress-Archive -Path shared_app\build\windows\x64\runner\Release\* -DestinationPath installers\windows\Output\UniversalDeviceAgent-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            ${{ env.ROOT }}/installers/windows/Output/*.exe
            ${{ env.ROOT }}/installers/windows/Output/*.zip

  # ------------------------------------------------------------------ LINUX (OS) DEB
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project folder dhoondo
        shell: bash
        run: |
          P=$(find . -type f -path '*/shared_app/pubspec.yaml' -not -path './.git/*' | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$P" ]; then echo "shared_app/pubspec.yaml repo mein nahi mili."; exit 1; fi
          ROOT=$(dirname "$(dirname "$P")")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libpipewire-0.3-dev \
            libx11-dev libxtst-dev libturbojpeg0-dev libebook1.2-dev dpkg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter create --platforms=linux --org com.deviceagent --project-name shared_app .
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter pub get
      - working-directory: ${{ env.ROOT }}/shared_app
        run: flutter build linux --release --dart-define=CONTROL_API_URL=${{ env.CONTROL_API_URL }}
      - name: .deb package banao
        working-directory: ${{ env.ROOT }}
        run: |
          chmod +x scripts/package_linux_deb.sh
          scripts/package_linux_deb.sh "0.1.0"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ env.ROOT }}/dist/*.deb

  # ------------------------------------------------------------------ GITHUB RELEASE
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
